name: Despliegue de Eme-JS a GitHub Pages

# Ejecutar al subir cambios (o fusionar una PR) a la rama principal
on:
  push:
    branches:
      - main

# Permisos necesarios para GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evitar despliegues simultáneos
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Descargar el código fuente del repositorio
      - name: Obtener repositorio
        uses: actions/checkout@v4

      # 2. Configurar el entorno de Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Validar: si app.js tiene un error de sintaxis, el pipeline se para aquí
      - name: Validar sintaxis de app.js
        run: node --check app.js

      # 4. Instalar JSDoc en el runner
      - name: Instalar JSDoc
        run: npm install jsdoc

      # 5. Generar la documentación JSDoc dentro de la carpeta docs/
      - name: Generar documentación con JSDoc
        run: npx jsdoc app.js -d docs

      # 6. Quitar node_modules para no publicarlo
      - name: Limpiar dependencias
        run: rm -rf node_modules package.json package-lock.json

      # 7. Configurar los metadatos de GitHub Pages
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # 8. Empaquetar la web (index.html, app.js) y la documentación (docs/)
      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 9. Publicar en la URL pública de GitHub Pages
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4